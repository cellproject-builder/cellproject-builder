<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="dynamic_diary" />

    <title>dynamic_diary — planos, evidências e revisões</title>
    <meta name="description" content="Aprenda, compreenda e construa com IA. Explore as premissas de um plano, registre previsões e observações e revise a partir de evidências." />

    <!-- Identity stays text-only until a new logo is defined. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />

    <!-- Theme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved appearance before the first paint.
      let appearance = 'oled';
      try {
        const saved = localStorage.getItem('dynamic_diary-theme');
        if (['oled', 'dark', 'light'].includes(saved)) appearance = saved;
      } catch {}
      document.documentElement.dataset.theme = appearance;
      document.documentElement.style.backgroundColor = appearance === 'light' ? '#F5F5F7' : appearance === 'dark' ? '#1C1C1E' : '#000000';
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="dynamic_diary — planos, evidências e revisões" />
    <meta property="og:description" content="Explore as premissas de um plano com IA, registre previsões e observações e revise a partir de evidências." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dynamic_diary — planos, evidências e revisões" />
    <meta name="twitter:description" content="Aprenda, compreenda e construa com IA, confrontando planos com evidências." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
